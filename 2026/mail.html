<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Opening Email Client — DS&amp;B</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
    max-width: 520px;
    margin: 60px auto;
    padding: 30px 20px;
    text-align: center;
    color: #333;
    line-height: 1.6;
  }
  h1 {
    color: #00316b;
    font-size: 22px;
    margin-bottom: 16px;
    transition: color 0.3s;
  }
  h1.highlight { color: #d63384; }
  p { margin: 12px 0; }
  .big-btn {
    display: inline-block;
    margin: 24px 0;
    padding: 18px 36px;
    background: #00316b;
    color: #ffffff !important;
    text-decoration: none;
    border-radius: 10px;
    font-weight: bold;
    font-size: 18px;
    box-shadow: 0 2px 8px rgba(0, 49, 107, 0.25);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .big-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 14px rgba(0, 49, 107, 0.35);
  }
  .big-btn.pulse {
    animation: pulse 1.3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% {
      transform: scale(1);
      box-shadow: 0 0 0 0 rgba(214, 51, 132, 0.55);
    }
    50% {
      transform: scale(1.06);
      box-shadow: 0 0 0 14px rgba(214, 51, 132, 0);
    }
  }
  .fallback {
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid #eee;
    font-size: 14px;
    color: #666;
  }
  .fallback a { color: #00316b; }
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid #ccc;
    border-top-color: #00316b;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .arrow {
    display: none;
    font-size: 28px;
    color: #d63384;
    margin-top: -8px;
    animation: bounce 1s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(8px); }
  }
  .arrow.show { display: block; }
</style>
</head>
<body>
  <h1 id="heading"><span class="spinner" id="spinner"></span><span id="heading-text">Opening your email client&hellip;</span></h1>
  <p id="subtext">This should happen automatically&hellip;</p>
  <div class="arrow" id="arrow">&#x2B07;</div>
  <p><a class="big-btn" id="mail-btn" href="mailto:mail@dsb.co.th">Email mail@dsb.co.th</a></p>
  <div class="fallback">
    <p>Or visit our <a href="https://dsb.co.th/contact/">Contact page</a> for other ways to reach us.</p>
    <p><strong>Domnern Somgiat &amp; Boonma Law Office Limited</strong><br>
    Tel: (+66) 2639-1955</p>
  </div>
  <script>
    // Step 1: Try auto-trigger mailto: after body renders (150ms delay).
    // Works on first open, but browsers often block subsequent auto-triggers
    // as anti-abuse measure.
    setTimeout(function() {
      window.location.href = 'mailto:mail@dsb.co.th';
    }, 150);

    // Step 2: After 1.2 seconds, if we're still visible on this page,
    // the auto-trigger was blocked. Highlight the button loudly so user
    // notices they need to click it manually (user-gesture always works).
    setTimeout(function() {
      if (document.visibilityState === 'visible') {
        // Auto-trigger likely blocked — draw attention to the button
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('heading').classList.add('highlight');
        document.getElementById('heading-text').textContent = 'Click the button to email us';
        document.getElementById('subtext').textContent = 'Your browser blocked the automatic action. Please click below:';
        document.getElementById('arrow').classList.add('show');
        document.getElementById('mail-btn').classList.add('pulse');
      }
    }, 1200);
  </script>
</body>
</html>
